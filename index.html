<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-section">
        <div class="background-img">
        <img src="Background.jpg" alt="Background image" height="" width="401">
        </div>
        <div class="Odin-img">
            <img src="Odin-Logo.png" alt="Odin Logo" height="90" width="80">
            <div class="image-text">
                Odin
            </div>
        </div>
    </div>
    <div class="right-section">
        <div class="header">
            <p>This is not a real online service!You Know you need something
                like this in your life to help you realize your deepest
                dreams.Sign Up now to get started.
            </p>
            <p>You Know you want to.</p>
        </div>
        <div class="main">
                <h1>Let's do this.</h1>
                
            <form action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="first-name" value="Thor" required>
            </div>
            
            <div class="form-group">
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" value="Odinsonj" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="phone">PHONE NUMBER</label>
              <input type="tel" id="phone" name="phone">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="password">PASSWORD</label>
              <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn-create">Create Account</button>
            <p class="login-link">Already have an account? <a href="#">Log in</a></p>
          </div>
        </form>
        </div>
    </div>

</body>
</html>
